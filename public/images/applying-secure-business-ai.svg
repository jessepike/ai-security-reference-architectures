<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:58px;font-weight:700;fill:#102B3F}.sub{font-size:24px;fill:#536875}.num{font-size:34px;font-weight:700;fill:#ffffff}.stage{font-size:21px;font-weight:700;fill:#ffffff}.label{font-size:14px;font-weight:700;fill:#0A7C78;letter-spacing:1px}.body{font-size:17px;fill:#17242E}.small{font-size:15px;fill:#536875}.foot{font-size:14px;fill:#536875}</style>
<text x="72" y="82" class="title">Applying Secure Business AI</text>
<text x="72" y="121" class="sub">How security supports business-led AI development and transformation</text>
<rect x="72" y="150" width="1776" height="52" rx="12" fill="#102B3F"/>
<text x="960" y="183" text-anchor="middle" font-size="19" fill="#ffffff">Intended business change → credible consequences → desired security conditions → work and protections → scoped evidence → decision and reassessment.</text>
<rect x="72.0" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="72.0" y="230" width="284.3" height="78" rx="16" fill="#0A7C78"/>
<rect x="72.0" y="286" width="284.3" height="22" fill="#0A7C78"/>
<text x="90.0" y="281" class="num">0</text>
<text x="138.0" y="261" class="stage" fill="#ffffff">Envision</text>
<text x="90.0" y="342" class="label">BUSINESS GOAL</text>
<text x="90.0" y="370" class="body">Shape and select the</text>
<text x="90.0" y="393" class="body">opportunity.</text>
<text x="90.0" y="436" class="label">SECURITY HELPS</text>
<text x="90.0" y="464" class="body">Surface likely exposure</text>
<text x="90.0" y="487" class="body">while choices are</text>
<text x="90.0" y="510" class="body">flexible.</text>
<text x="90.0" y="553" class="label">FOR NEXT DECISION</text>
<text x="90.0" y="581" class="body">Owner, value, people,</text>
<text x="90.0" y="604" class="body">data, actions and open</text>
<text x="90.0" y="627" class="body">questions.</text>
<rect x="370.3" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="370.3" y="230" width="284.3" height="78" rx="16" fill="#0B8883"/>
<rect x="370.3" y="286" width="284.3" height="22" fill="#0B8883"/>
<text x="388.3" y="281" class="num">1</text>
<text x="436.3" y="261" class="stage" fill="#ffffff">Discover and</text>
<text x="436.3" y="284" font-size="21" font-weight="700" fill="#ffffff">guardrail</text>
<text x="388.3" y="342" class="label">BUSINESS GOAL</text>
<text x="388.3" y="370" class="body">Define a bounded first</text>
<text x="388.3" y="393" class="body">use.</text>
<text x="388.3" y="436" class="label">SECURITY HELPS</text>
<text x="388.3" y="464" class="body">Map the workflow,</text>
<text x="388.3" y="487" class="body">consequences and</text>
<text x="388.3" y="510" class="body">guardrails.</text>
<text x="388.3" y="553" class="label">FOR NEXT DECISION</text>
<text x="388.3" y="581" class="body">Boundary, authority,</text>
<text x="388.3" y="604" class="body">obligations, protections</text>
<text x="388.3" y="627" class="body">and pilot decision.</text>
<rect x="668.7" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="668.7" y="230" width="284.3" height="78" rx="16" fill="#0D918C"/>
<rect x="668.7" y="286" width="284.3" height="22" fill="#0D918C"/>
<text x="686.7" y="281" class="num">2</text>
<text x="734.7" y="261" class="stage" fill="#ffffff">Pilot</text>
<text x="686.7" y="342" class="label">BUSINESS GOAL</text>
<text x="686.7" y="370" class="body">Learn from bounded real</text>
<text x="686.7" y="393" class="body">use.</text>
<text x="686.7" y="436" class="label">SECURITY HELPS</text>
<text x="686.7" y="464" class="body">Observe behavior and</text>
<text x="686.7" y="487" class="body">test protections and</text>
<text x="686.7" y="510" class="body">recovery.</text>
<text x="686.7" y="553" class="label">FOR NEXT DECISION</text>
<text x="686.7" y="581" class="body">Scoped evidence, value</text>
<text x="686.7" y="604" class="body">results, unknowns and</text>
<text x="686.7" y="627" class="body">production needs.</text>
<rect x="967.0" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="967.0" y="230" width="284.3" height="78" rx="16" fill="#119B95"/>
<rect x="967.0" y="286" width="284.3" height="22" fill="#119B95"/>
<text x="985.0" y="281" class="num">3</text>
<text x="1033.0" y="261" class="stage" fill="#ffffff">Develop</text>
<text x="985.0" y="342" class="label">BUSINESS GOAL</text>
<text x="985.0" y="370" class="body">Build or configure the</text>
<text x="985.0" y="393" class="body">production capability.</text>
<text x="985.0" y="436" class="label">SECURITY HELPS</text>
<text x="985.0" y="464" class="body">Turn conditions into</text>
<text x="985.0" y="487" class="body">implementation and</text>
<text x="985.0" y="510" class="body">tests.</text>
<text x="985.0" y="553" class="label">FOR NEXT DECISION</text>
<text x="985.0" y="581" class="body">Design, controls,</text>
<text x="985.0" y="604" class="body">supplier evidence,</text>
<text x="985.0" y="627" class="body">tests, owners and</text>
<text x="985.0" y="650" class="body">exceptions.</text>
<rect x="1265.3" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="1265.3" y="230" width="284.3" height="78" rx="16" fill="#17908F"/>
<rect x="1265.3" y="286" width="284.3" height="22" fill="#17908F"/>
<text x="1283.3" y="281" class="num">4</text>
<text x="1331.3" y="261" class="stage" fill="#ffffff">Production</text>
<text x="1331.3" y="284" font-size="21" font-weight="700" fill="#ffffff">transition</text>
<text x="1283.3" y="342" class="label">BUSINESS GOAL</text>
<text x="1283.3" y="370" class="body">Decide whether</text>
<text x="1283.3" y="393" class="body">production use should</text>
<text x="1283.3" y="416" class="body">begin.</text>
<text x="1283.3" y="459" class="label">SECURITY HELPS</text>
<text x="1283.3" y="487" class="body">Validate the deployment</text>
<text x="1283.3" y="510" class="body">and present evidence and</text>
<text x="1283.3" y="533" class="body">limits.</text>
<text x="1283.3" y="576" class="label">FOR NEXT DECISION</text>
<text x="1283.3" y="604" class="body">Deployed boundary,</text>
<text x="1283.3" y="627" class="body">operating readiness,</text>
<text x="1283.3" y="650" class="body">evidence, exceptions and</text>
<text x="1283.3" y="673" class="body">release conditions.</text>
<rect x="1563.7" y="230" width="284.3" height="626" rx="16" fill="#F8FBFC" stroke="#C9D8DE" stroke-width="2"/>
<rect x="1563.7" y="230" width="284.3" height="78" rx="16" fill="#176E79"/>
<rect x="1563.7" y="286" width="284.3" height="22" fill="#176E79"/>
<text x="1581.7" y="281" class="num">5</text>
<text x="1629.7" y="261" class="stage" fill="#ffffff">Operate</text>
<text x="1581.7" y="342" class="label">BUSINESS GOAL</text>
<text x="1581.7" y="370" class="body">Keep the capability</text>
<text x="1581.7" y="393" class="body">useful through change.</text>
<text x="1581.7" y="436" class="label">SECURITY HELPS</text>
<text x="1581.7" y="464" class="body">Monitor, respond,</text>
<text x="1581.7" y="487" class="body">reassess and verify</text>
<text x="1581.7" y="510" class="body">retirement.</text>
<text x="1581.7" y="553" class="label">FOR NEXT DECISION</text>
<text x="1581.7" y="581" class="body">Current purpose,</text>
<text x="1581.7" y="604" class="body">evidence, changes,</text>
<text x="1581.7" y="627" class="body">incidents, constraints</text>
<text x="1581.7" y="650" class="body">and retirement needs.</text>
<rect x="72" y="884" width="1776" height="92" rx="15" fill="#EAF6F5" stroke="#A9D8D5" stroke-width="2"/>
<text x="96" y="918" class="label">ONE LIVING RECORD ACROSS THE JOURNEY</text>
<text x="96" y="951" font-size="22" fill="#17242E">Facts  |  value  |  consequences  |  conditions  |  obligations  |  controls  |  evidence  |  decisions  |  change</text>
<text x="960" y="998" text-anchor="middle" class="small">Stages describe an AI effort; governance responsibilities apply throughout.</text>
<text x="960" y="1020" text-anchor="middle" class="small">Material change or new evidence can reopen earlier work.</text>
<path d="M 1740 1034 C 1560 1052, 380 1052, 190 1034" fill="none" stroke="#0A7C78" stroke-width="4"/>
<path d="M 190 1028 l 18 8 l -4 -20 z" fill="#0A7C78"/>
<text x="1848" y="1063" text-anchor="end" class="foot">Proposed neutral application companion | Review draft | 14 September 2026</text>
</svg>